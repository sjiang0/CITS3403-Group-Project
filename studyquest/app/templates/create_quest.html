{% extends "base.html" %}

{% block title %}Create Quest - Study Quest{% endblock %}

{% block content %}

<h2 class="text-2xl font-bold mb-4">Create Quest</h2>

<section class="card">

  <form method="POST" action="{{ url_for('create_quest') }}">

    <!-- QUEST TITLE -->
    <div class="form-group">
      <label class="form-label">Quest Title</label>
      <input type="text" name="title" class="form-input">
    </div>

    <!-- DESCRIPTION -->
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-textarea"></textarea>
    </div>

    <!-- QUEST TYPE -->
    <div class="mb-4">
      <label class="form-label">Quest Type</label>
      <select name="quest_type" class="form-select">
        <option value="study">Study</option>
        <option value="assignment">Assignment</option>
        <option value="exam">Exam Prep</option>
        <option value="personal">Personal</option>
      </select>
    </div>

    <!-- DIFFICULTY -->
    <div class="mb-4">
      <label class="form-label">Difficulty</label>
      <select name="difficulty" class="form-select">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <!-- DUE DATE -->
    <div class="mb-5">
      <label class="form-label">Due Date</label>
      <input name="due_date" type="date" class="form-input">
      <p class="text-sm text-gray-500">Optional</p>
    </div>

    <!-- SUBMIT -->
    <button type="submit" class="btn btn-primary">
      Create Quest
    </button>

  </form>

</section>

{% endblock %}
